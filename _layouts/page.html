---
layout: default
---
<main id="main">
<article>
<header id="cover" class="container"
     {% if page.image %}style="background-image: url({{ page.image }});"{% endif %}>
    <div>
        <h1>{{ page.title }}</h1>
        {% if page.description %}<p>{{ page.description | newline_to_br }}</p>{% endif %}
    </div>
</header>

<div id="content" class="container">
    <div id="post-content" class="post page">
        {{ content }}
    </div>
</div>
</article>
</main>
