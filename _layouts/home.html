---
layout: default
---
{% assign cover = site.cover_image | default: site.image %}
<div id="cover" class="container"
    {% if cover %}style="background-image:url({{ cover }});"{% endif %}>
    <div>
        <h1>{{ site.title }}</h1>
        <p>{{ site.description | newline_to_br }}</p>
    </div>
</div>

<main id="content" class="container">
    <div id="home-content">
        {{ content }}
    </div>
</main>
