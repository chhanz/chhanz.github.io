# AEO data for _posts/2021-03-31-vdo.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "CentOS 8.1에서 VDO 볼륨을 만들고 LVM과 XFS를 올린 뒤, 중복 제거·압축 효과와 물리 공간이 가득 찼을 때의 동작을 테스트한 내용을 정리합니다."
keywords:
- "VDO"
- "Virtual Data Optimizer"
- "kmod-kvdo"
- "vdo create"
- "vdostats"
- "중복 제거"
- "CentOS 8.1"
summary:
- "`dnf install vdo kmod-kvdo`로 설치하고 `vdo create --device /dev/sda3 --vdoLogicalSize 200G --name vdo1`로 볼륨을 만듭니다."
- "같은 1GB 파일을 400번 복사한 테스트에서 `vdostats --hu`의 Space saving이 88%까지 올라 중복 제거 효과를 확인했습니다."
- "중복 제거가 안 되는 데이터로 물리 공간이 100% 차면 filesystem에 Input/output error가 나며 더 이상 쓸 수 없습니다."
tested_on: "CentOS 8.1"
faq:
- q: "VDO 볼륨을 재부팅 후 자동 마운트하려면 fstab에 어떻게 등록하나요?"
  a: "`/etc/fstab`에 `defaults,_netdev,x-systemd.device-timeout=0,x-systemd.requires=vdo.service` 옵션으로 등록합니다. 본문 예제는 `/dev/testvg/testlv /mnt/testlv xfs` 항목에 이 옵션을 사용했습니다."
- q: "VDO의 중복 제거와 압축이 켜져 있는지 어떻게 확인하나요?"
  a: "`vdo status | egrep 'Deduplication|Compression'`을 실행해 둘 다 `enabled`인지 확인합니다."
- q: "VDO 물리 공간이 가득 차면 어떻게 되나요?"
  a: "VDO의 Used가 100%가 되면 해당 filesystem에 더 이상 데이터를 만들 수 없고 `Input/output error`가 발생합니다. 그 전에 `/var/log/messages`에 `VDO pool vdo1 is now 80.33% full` 같은 경고가 단계적으로 기록됩니다."
- q: "VDO의 단점은 무엇인가요?"
  a: "일반적인 스토리지에 비해 성능 저하가 발생합니다. 대신 중복 제거와 압축으로 공간 활용도가 높아지며 VM과 컨테이너 환경에서 효율이 높다고 합니다."
