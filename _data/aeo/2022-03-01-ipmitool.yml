# AEO data for _posts/2022-03-01-ipmitool.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "ipmitool 설치부터 IPMI LAN 정보 확인과 IP 설정, User 생성과 권한 부여, 전원 제어, SEL/SDR/FRU 조회, lanplus 원격 접근까지 자주 쓰는 명령을 정리합니다."
keywords:
- "ipmitool"
- "IPMI"
- "BMC"
- "ipmitool lan set"
- "ipmitool chassis power"
- "ipmitool sel list"
- "lanplus"
summary:
- "`ipmitool lan set` 으로 IPMI 원격 접근 IP 를 설정하고, 적용하려면 `ipmitool bmc reset cold` 로 IPMI 를 재시작해야 합니다."
- "`ipmitool user set name`, `user set password`, `user priv` 로 사용자를 만들고 권한을 부여하며, Administrator 권한은 레벨 `4` 입니다."
- "`ipmitool -I lanplus -U <user> -P <passwd> -H <IPMI IP>` 로 원격에서 전원 상태 확인과 on/off 를 할 수 있습니다."
faq:
- q: "ipmitool 로 IPMI IP 를 설정하려면 어떻게 하나요?"
  a: "`ipmitool lan set <channel> ipsrc static` 후 `ipaddr`, `netmask`, `defgw ipaddr`, `access on` 을 차례로 설정합니다. 설정 후 `ipmitool bmc reset cold` 로 재시작해야 정상 작동합니다."
- q: "ipmitool 로 IPMI 사용자에게 Administrator 권한을 주려면 어떻게 하나요?"
  a: "`ipmitool user priv <user id> 4 [<channel>]` 처럼 privilege level `4` 를 지정합니다."
- q: "원격에서 ipmitool 로 서버 전원을 제어할 수 있나요?"
  a: "네, `ipmitool -I lanplus -U <user id> -P <user passwd> -H <IPMI IP> chassis power status` 처럼 `-I lanplus` 옵션으로 원격 IPMI 를 제어할 수 있습니다."
- q: "ipmitool 로 하드웨어 로그와 센서 상태는 어떻게 확인하나요?"
  a: "System Event Log 는 `ipmitool sel list`, 온도 등 센서 상태는 `ipmitool sdr list`, 부품 정보는 `ipmitool fru list` 로 확인합니다."
