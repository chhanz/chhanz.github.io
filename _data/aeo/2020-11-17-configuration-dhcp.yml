# AEO data for _posts/2020-11-17-configuration-dhcp.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "CentOS 7에서 dhcp 패키지로 DHCP 서버를 설치하고 dhcpd.conf에 서브넷, 임대 시간, IP 범위와 MAC 주소 기반 고정 IP를 설정하는 방법을 정리합니다."
keywords:
- "dhcpd"
- "DHCP 서버"
- "/etc/dhcp/dhcpd.conf"
- "fixed-address"
- "default-lease-time"
- "DHCPDISCOVER"
- "CentOS 7"
summary:
- "`yum -y install dhcp`로 설치하고 `systemctl enable --now dhcpd`로 DHCP 서비스를 시작합니다."
- "`/etc/dhcp/dhcpd.conf`에 도메인, DNS, 임대 시간, gateway, 할당 IP range를 global 또는 subnet 단위로 설정합니다."
- "`host` 블록에 `hardware ethernet`과 `fixed-address`를 지정하면 특정 MAC 주소에 항상 같은 IP를 할당할 수 있습니다."
tested_on: "CentOS 7"
faq:
- q: "DHCP 서버에서 특정 MAC 주소에 고정 IP를 주려면 어떻게 하나요?"
  a: "`/etc/dhcp/dhcpd.conf` 하단에 `host` 블록을 추가하고 `hardware ethernet 00:50:57:81:c8:50;`과 `fixed-address 10.50.2.52;`처럼 MAC 주소와 IP를 지정합니다."
- q: "dhcpd.conf의 default-lease-time과 max-lease-time은 무엇인가요?"
  a: "default-lease-time은 임대 요청 만료 시간, max-lease-time은 클라이언트가 IP를 가지고 있을 최대 시간이며 둘 다 초 단위입니다. 본문 예제는 각각 3600과 7200으로 설정했습니다."
- q: "DHCP가 정상적으로 IP를 할당하는지 어떻게 확인하나요?"
  a: "`tailf /var/log/messages`로 로그를 보면서 DHCPDISCOVER, DHCPOFFER, DHCPREQUEST, DHCPACK 순서로 기록되는지 확인합니다."
