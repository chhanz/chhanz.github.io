# AEO data for _posts/2021-05-25-use-du.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "du --max-depth 로 경로별 디스크 사용량을 확인하는 방법과, 방향키로 탐색하며 사용량을 볼 수 있는 ncdu 도구의 설치와 사용법을 정리합니다."
keywords:
- "du"
- "du --max-depth"
- "ncdu"
- "EPEL"
- "디스크 사용량"
summary:
- "`du -h --max-depth=1` 을 사용하면 `/` 하위 1단계 디렉토리별 사용량만 간단히 확인할 수 있습니다."
- "`ncdu` 를 사용하면 경로를 옮겨 다시 명령을 실행하지 않고 방향키와 Enter 로 depth 별 사용량을 탐색할 수 있습니다."
- "`ncdu` 는 EPEL repository 를 활성화한 뒤 `yum install ncdu` 로 설치합니다."
faq:
- q: "du 명령에서 특정 깊이까지만 사용량을 보려면 어떻게 하나요?"
  a: "`-d, --max-depth=N` 옵션을 사용합니다. 예를 들어 `du -h / --max-depth=1 2>/dev/null` 은 `/` 바로 아래 디렉토리별 사용량만 출력합니다."
- q: "ncdu 는 du 와 비교해 어떤 점이 편리한가요?"
  a: "depth 1 확인 후 depth 2 를 보려고 해당 경로로 이동해 다시 명령을 실행할 필요가 없습니다. 방향키와 Enter 로 디렉토리를 오가며 사용량을 바로 확인할 수 있습니다."
- q: "ncdu 는 어떻게 설치하나요?"
  a: "EPEL repository 가 활성화되어 있어야 하며, `sudo yum install ncdu` 로 설치합니다."
- q: "ncdu 에서 정렬이나 삭제 같은 단축키는 어떻게 확인하나요?"
  a: "`?` 를 입력하면 도움말이 표시됩니다. 예를 들어 `s` 는 크기순 정렬, `n` 은 이름순 정렬, `d` 는 선택한 파일이나 디렉토리 삭제입니다."
