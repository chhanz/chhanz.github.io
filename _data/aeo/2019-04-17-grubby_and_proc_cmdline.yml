# AEO data for _posts/2019-04-17-grubby_and_proc_cmdline.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "grubby 명령으로 GRUB2 부트 엔트리의 커널 파라미터를 조회, 추가, 삭제하고 /proc/cmdline으로 현재 부팅 파라미터를 확인하는 방법을 정리합니다."
keywords:
- "grubby"
- "GRUB2"
- "커널 파라미터"
- "--update-kernel"
- "--remove-args"
- "/proc/cmdline"
summary:
- "grubby를 쓰면 GRUB2 설정 파일을 직접 편집하지 않고 커널 부트 파라미터를 조회, 추가, 삭제할 수 있습니다."
- "`grubby --update-kernel=ALL --args=\"...\"`로 파라미터를 추가하고 `--remove-args`로 제거하며, `--update-kernel`에 특정 커널을 지정할 수도 있습니다."
- "현재 부팅에 적용된 커널 파라미터는 `cat /proc/cmdline`으로 확인합니다."
faq:
- q: "grubby로 현재 부트 엔트리의 커널 파라미터를 확인하려면 어떻게 하나요?"
  a: "`grubby --info=ALL`을 실행합니다. 각 엔트리의 index, kernel, args, root, initrd, title이 출력됩니다."
- q: "grubby로 모든 커널에 부트 파라미터를 추가하거나 제거하려면 어떻게 하나요?"
  a: "추가는 `grubby --update-kernel=ALL --args=\"spectre_v2=off nopti\"`, 제거는 `grubby --update-kernel=ALL --remove-args=\"spectre_v2=off nopti\"`처럼 실행합니다. ALL 대신 특정 커널을 지정하면 그 커널에만 적용됩니다."
- q: "현재 부팅된 커널 파라미터는 어떻게 확인하나요?"
  a: "`cat /proc/cmdline`을 실행하면 현재 부팅에 사용된 BOOT_IMAGE와 커널 파라미터가 표시됩니다."
