# AEO data for _posts/2026-02-13-claude-code-with-bedrock.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "EC2 인스턴스 프로파일과 Amazon Bedrock으로 Anthropic 계정 없이 Claude Code를 사용하고, code-server에서 Claude Code 확장까지 구성하는 방법을 정리합니다."
keywords:
- "Claude Code"
- "Amazon Bedrock"
- "code-server"
- "CLAUDE_CODE_USE_BEDROCK"
- "EC2 인스턴스 프로파일"
- "AmazonBedrockLimitedAccess"
- "IAM 역할"
summary:
- "EC2 인스턴스 프로파일에 Bedrock 권한을 주고 `CLAUDE_CODE_USE_BEDROCK` 환경 변수를 설정하면 Anthropic 계정 없이 IAM 역할 기반으로 Claude Code를 사용할 수 있습니다."
- "code-server를 설치하고 Claude Code 확장 플러그인을 CLI 모드로 설정하면 브라우저의 VS Code 환경에서도 Claude Code를 쓸 수 있습니다."
tested_on: "Amazon Linux 2023.10.20260202 (ap-northeast-2), code-server v4.108.2, Claude Code 2.1.39"
faq:
- q: "Claude Code가 Amazon Bedrock을 사용하게 하려면 어떻게 설정하나요?"
  a: "`~/.claude/settings.json`의 `env`에 `\"CLAUDE_CODE_USE_BEDROCK\": \"1\"`과 `\"AWS_REGION\": \"ap-northeast-2\"`처럼 리전을 지정합니다. 인증은 EC2에 연결한 인스턴스 프로파일의 IAM 역할을 사용합니다."
- q: "EC2용 IAM 역할에는 어떤 정책을 연결했나요?"
  a: "`AmazonBedrockLimitedAccess`와 `AWSMcpServiceActionsFullAccess` 관리형 정책을 연결했습니다. 이후 인스턴스 프로파일을 만들어 역할을 추가하고 EC2 인스턴스에 연결합니다."
- q: "인스턴스에서 Bedrock의 Claude 모델을 쓸 수 있는지 어떻게 확인하나요?"
  a: "`aws bedrock list-foundation-models` 결과에서 `anthropic.claude-opus-4-5-20251101-v1`처럼 사용할 Claude 모델 ID가 조회되는지 확인합니다."
- q: "code-server에서 Claude Code를 쓰려면 어떻게 하나요?"
  a: "`curl -fsSL https://code-server.dev/install.sh | sh`로 code-server를 설치하고 `config.yaml`의 `bind-addr`와 password를 확인해 접속한 뒤 확장 플러그인에서 Claude Code를 설치합니다. 로그인 프롬프트를 끄고 CLI 모드로 설정하면 브라우저 환경에서도 사용할 수 있습니다."
