# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
keywords:
- "apt-mirror"
- "mirror.list"
- "Local mirror site"
- "DVD Repository"
- "python3 -m http.server"
- "sources.list"
- "망분리"
summary:
- "인터넷이 안 되는 망분리 환경에서는 DVD 를 mount 하고 `deb file:/mnt/ubuntu jammy main` 을 list 파일로 추가해 패키지를 설치할 수 있습니다."
- "`apt-mirror` 로 `/etc/apt/mirror.list` 에 지정한 Repository 를 sync 하면 기본적으로 `/var/spool/apt-mirror/mirror/` 아래에 데이터가 저장됩니다."
- "sync 한 경로에서 `python3 -m http.server` 로 HTTP 서비스를 띄우고 클라이언트 sources.list 에 내부 주소를 넣으면 내부 Mirror site 로 사용할 수 있습니다."
tested_on: "Ubuntu 22.04 (jammy)"
faq:
- q: "인터넷이 안 되는 Ubuntu 서버에서 DVD 로 패키지를 설치하려면 어떻게 하나요?"
  a: "`sudo mount /dev/sr0 /mnt` 로 DVD 를 mount 하고 `/etc/apt/sources.list.d/dvd.list` 에 `deb file:/mnt/ubuntu jammy main` 을 추가한 뒤 `apt-get update` 를 실행합니다. 외부 Repository 설정은 주석 처리하거나 제거합니다."
- q: "apt-mirror 의 mirror.list 에서 주요 옵션은 무엇인가요?"
  a: "`base_path` 는 mirror 데이터 저장 경로, `nthreads` 는 sync 에 쓸 wget thread 수이며, `deb`, `deb-amd64`, `deb-i386` 으로 현재 OS Bit, 64bit, 32bit 패키지를 지정합니다."
- q: "apt-mirror 로 sync 한 저장소를 간단히 서비스하려면 어떻게 하나요?"
  a: "apache 나 nginx 를 쓰는 것이 가장 좋지만, sync 경로에서 `python3 -m http.server` 를 실행하면 8000 포트로 바로 서비스할 수 있습니다. 클라이언트에는 `deb http://localhost:8000/ubuntu jammy main restricted universe multiverse` 형식으로 추가합니다."
- q: "공식 apt-mirror 로 최신 Ubuntu Release 를 sync 할 때 주의할 점이 있나요?"
  a: "공식 apt-mirror 는 유지보수가 되지 않아 최신 Ubuntu Release 를 정상적으로 sync 하지 못합니다. 별도 글에 정리된 fork 버전 workaround 를 참고해야 합니다."
