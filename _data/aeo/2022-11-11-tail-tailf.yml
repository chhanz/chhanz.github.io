# AEO data for _posts/2022-11-11-tail-tailf.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "util-linux에서 제거된 tailf 명령을 tail -f 래퍼 스크립트로 대체하는 방법과 tail의 -f, -F 옵션 차이를 정리한 메모입니다."
keywords:
- "tailf"
- "tail -f"
- "tail -F"
- "util-linux"
- "--retry"
- "로그 모니터링"
summary:
- "`tailf`는 util-linux 패키지에서 2017년에 제거된 것으로 보이며, `tail -f`를 호출하는 간단한 스크립트로 대체해 사용할 수 있습니다."
- "`tail -F`는 `--follow=name --retry`와 같아서 파일이 삭제된 뒤 다시 생성되어도 새 파일을 계속 따라갑니다."
faq:
- q: "최신 Linux에서 tailf 명령이 없는 이유는 무엇인가요?"
  a: "`tailf`는 util-linux 패키지에 포함되어 있다가 2017년에 제거된 것으로 보입니다. 대신 `tail -f`를 사용하거나 `tail -f $1`을 실행하는 스크립트를 `tailf`라는 이름으로 만들어 쓸 수 있습니다."
- q: "tail -f 와 tail -F 의 차이는 무엇인가요?"
  a: "`-F`는 `--follow=name --retry`와 같아 파일이 사라졌다가 다시 생기면 새 파일을 다시 추적합니다. 테스트에서 `tail -F`는 파일 삭제 후 재생성 시 'has appeared; following end of new file' 메시지와 함께 새 파일 모니터링을 이어갔습니다."
