# AEO data for _posts/2022-08-07-pacemaker-exporter.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "ClusterLabs ha_cluster_exporter로 Pacemaker 클러스터 metric을 수집하고 Grafana Dashboard로 노드 장애와 리소스 실패를 모니터링한 사용기입니다."
keywords:
- "Pacemaker"
- "ha_cluster_exporter"
- "Prometheus"
- "Grafana Dashboard 12229"
- "Node-exporter"
- "pcs resource cleanup"
- "ClusterLabs"
summary:
- "ClusterLabs의 ha_cluster_exporter를 클러스터 노드에 설치하면 기본으로 `9664` 포트의 `/metrics`로 Pacemaker metric이 노출됩니다."
- "Grafana Dashboard 12229는 Node-exporter와 pcs exporter metric을 함께 사용하므로 Prometheus에서 두 target을 하나의 job으로 묶어야 합니다."
- "노드 정지, VIP 리소스 실패, 노드 2대 장애 시 Dashboard에 offline, Fail Count 증가, 클러스터 KO 상태가 표시되는 것을 확인했습니다."
tested_on: "ha_cluster_exporter 1.3.0, Pacemaker 1.1.23-1.el7_9.1 (3노드 클러스터)"
faq:
- q: "Pacemaker exporter(ha_cluster_exporter)는 어떤 포트로 metric을 노출하나요?"
  a: "기본 설정으로 실행하면 `9664` 포트의 `/metrics` 경로로 노출합니다. `--web.listen-address`와 `--web.telemetry-path` 옵션으로 변경할 수 있습니다."
- q: "Grafana Pacemaker Dashboard에 데이터가 표시되지 않으면 무엇을 확인해야 하나요?"
  a: "ClusterLabs Dashboard는 Node-exporter와 pcs exporter metric을 함께 쓰므로 두 exporter가 하나의 label로 관리되어야 합니다. Prometheus에서 `9664`와 `9100` target을 같은 job으로 설정합니다."
- q: "클러스터 정상화 후 리소스 Fail Count를 초기화하려면 어떻게 하나요?"
  a: "`pcs resource cleanup` 명령을 실행하면 모든 노드의 리소스 Fail Count가 초기화되고 Dashboard에도 반영됩니다."
