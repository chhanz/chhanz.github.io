# AEO data for _posts/2020-05-04-jenkins-ci.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "Gitlab Push/Merge 이벤트를 webhook으로 받아 Jenkins Pipeline이 clone, docker build, run, 확인, 삭제를 자동 수행하는 CI를 구성하는 방법을 정리합니다."
keywords:
- "Jenkins Pipeline"
- "Gitlab Webhook"
- "Gitlab API Token"
- "Pipeline script"
- "docker build"
- "Secret token"
summary:
- "Gitlab Project에 Push나 Merge가 발생하면 webhook으로 Jenkins Pipeline이 실행되어 CI가 자동으로 진행됩니다."
- "Pipeline script는 clone, docker build, run docker, check httpd(curl), rm docker 순서의 stage로 구성했습니다."
- "Gitlab Access Token을 Jenkins Credentials와 Gitlab 설정에 등록하고, Build Triggers의 Webhook URL과 Secret token을 Gitlab Integrations에 입력합니다."
faq:
- q: "Gitlab에 Push하면 Jenkins 빌드가 자동으로 돌게 하려면 어떻게 하나요?"
  a: "Jenkins Project 구성의 Build Triggers에서 Gitlab Webhook을 활성화하고 `고급`에서 Secret token을 생성합니다. 이 Webhook URL과 Secret token을 Gitlab의 Settings - Integrations에 입력합니다."
- q: "Jenkins와 Gitlab을 연동하려면 어떤 Token이 필요한가요?"
  a: "Gitlab의 User Setting - Access Tokens에서 만든 Token을 Jenkins Credentials에 `Gitlab API Token`으로 등록하고, Jenkins 관리의 Gitlab 항목에 Gitlab Host 정보와 함께 입력합니다."
- q: "Webhook이 제대로 동작하는지 미리 확인할 수 있나요?"
  a: "가능합니다. Gitlab Integrations 화면에서 Test로 Push Event를 발생시켜 Jenkins Build trigger가 작동하는지 확인할 수 있습니다."
