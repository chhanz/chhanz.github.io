summary:
- "Proxmox VE 8.2.1 ISO로 부팅해 `Install Proxmox VE (Graphical)`을 선택하면 GUI 설치 화면으로 설치할 수 있습니다."
- "설치 중 디스크(파티션·파일시스템은 Options 메뉴), Timezone, root 비밀번호, Static IP 기반 Management Network를 설정합니다."
- "설치 후 `https://[proxmox-ip]:8006`으로 접속해 root 계정으로 Management UI에 로그인할 수 있습니다."
