faq:
- q: "Proxmox VE 관리 웹 UI의 기본 접속 포트는 무엇인가요?"
  a: "기본 포트는 `8006`이며 `https://[proxmox-ip]:8006`으로 접속합니다. 설치 때 설정한 root 계정과 비밀번호로 로그인합니다."
- q: "Proxmox 설치 시 파티션 구성이나 파일시스템 종류는 어디서 바꾸나요?"
  a: "설치 디스크를 지정하는 화면의 `Options` 메뉴에서 파티션 구성과 파일시스템 종류를 선택할 수 있습니다."
- q: "Proxmox 설치 중 Management Network는 어떻게 설정하나요?"
  a: "설치 화면에서 Proxmox의 Management Network를 직접 입력하며, 기본적으로 Static IP 설정을 사용합니다."
