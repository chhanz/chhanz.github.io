# AEO data for _posts/2017-01-16-aixerrorcfg64.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "AIX maintenance mode 셸에서 64-bit 프로그램 실행 오류로 ls 등 명령이 동작하지 않을 때 /etc/methods/cfg64로 해결하는 방법입니다."
keywords:
- "AIX"
- "maintenance mode"
- "/etc/methods/cfg64"
- "cfg64"
- "64-bit environment"
- "Could not load program"
summary:
- "AIX를 maintenance mode로 부팅한 셸에서 `Cannot run a 64-bit program` 오류가 나면 `/etc/methods/cfg64`를 실행해 64-bit 환경을 구성하면 됩니다."
- "`cfg64` 실행 후에는 오류가 났던 `ls` 같은 명령이 정상 동작합니다."
faq:
- q: "AIX maintenance mode에서 ls 실행 시 Cannot run a 64-bit program 오류가 나는 이유는 무엇인가요?"
  a: "64-bit 환경이 아직 구성되지 않았기 때문입니다. maintenance mode 셸에서 `/etc/methods/cfg64`를 실행하면 64-bit 환경이 구성되어 명령이 정상 동작합니다."
- q: "Could not load program 오류를 해결하는 명령은 무엇인가요?"
  a: "`/etc/methods/cfg64`입니다. 실행 후 `ls`를 다시 실행하면 파일 목록이 정상적으로 출력됩니다."
