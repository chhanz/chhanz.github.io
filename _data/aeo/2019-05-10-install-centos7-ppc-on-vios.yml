# AEO data for _posts/2019-05-10-install-centos7-ppc-on-vios.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "IBM Power7 서버의 PowerVM VIOS에서 LPAR에 가상 CD-ROM으로 ISO를 연결하고 CentOS 7 ppc64를 텍스트 모드로 설치하는 과정을 정리합니다."
keywords:
- "PowerVM"
- "VIOS"
- "LPAR"
- "CentOS 7 ppc64"
- "loadopt"
- "vCD-ROM"
- "SMS 모드"
- "POWER7"
summary:
- "VIOS에서 `loadopt -disk CentOS-7-ppc64-Everything-1804.iso -vtd vtopt0`으로 ISO를 가상 CD-ROM에 연결해 LPAR 설치를 준비합니다."
- "LPAR를 SMS 모드로 부팅해 vCD-ROM을 부팅 장치로 선택하면 x86과 비슷한 CentOS 7 설치 화면이 나오며, 텍스트 모드로 설치할 수 있습니다."
- "설치 후 `cat /etc/redhat-release`, `uname -a`, `yum repolist`, `/proc/cpuinfo`로 ppc64 커널과 POWER7 CPU, YUM 동작을 확인합니다."
tested_on: "IBM Power7 P750, IBM PowerVM 2.4, CentOS Linux 7.5.1804 (AltArch, ppc64)"
faq:
- q: "PowerVM VIOS에서 LPAR에 ISO를 연결하려면 어떻게 하나요?"
  a: "VIOS에서 `loadopt -disk <ISO 파일> -vtd vtopt0`을 실행해 가상 광학 장치에 ISO를 Mount합니다. `lsrep`으로 Repository의 ISO와 연결 상태를 확인할 수 있습니다."
- q: "PowerVM LPAR에서 CD로 부팅하려면 어떻게 하나요?"
  a: "LPAR를 켜고 SMS 모드로 진입한 뒤 Select Boot Options에서 vCD-ROM(SCSI CD-ROM)을 부팅 장치로 선택합니다."
- q: "Power 서버의 CentOS 7 설치 화면은 x86과 다른가요?"
  a: "선택한 ISO로 부팅하면 x86에서 보던 것과 비슷한 설치 화면이 나옵니다. 글에서는 X 시작이 실패해 텍스트 모드로 전환되었고, 텍스트 모드로 설치를 완료했습니다."
