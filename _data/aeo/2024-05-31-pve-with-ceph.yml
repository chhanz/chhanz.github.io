# AEO data for _posts/2024-05-31-pve-with-ceph.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
keywords:
- "Proxmox VE"
- "Ceph Quincy"
- "Ceph MON"
- "Ceph MGR"
- "Ceph OSD"
- "Ceph Pool"
- "RBD"
summary:
- "Proxmox 관리 GUI의 Datacenter > Ceph 메뉴에서 Ceph Quincy를 설치하고 MON, MGR, OSD, Pool까지 GUI로 구성할 수 있습니다."
- "3노드에 노드별 디스크 2개씩 OSD를 만들고 RBD 유형의 vmpool을 생성하면 각 노드에서 같은 Pool을 동시에 사용할 수 있습니다."
- "Ceph Pool을 사용하면 pve-cluster에서 라이브 마이그레이션을 손쉽게 할 수 있고, 기존 `ceph -s` 명령으로도 상태를 확인할 수 있습니다."
tested_on: "Proxmox VE 8.2.1 3노드, Ceph Quincy (No-Subscription Repository)"
faq:
- q: "Proxmox에서 Ceph를 설치하려면 어디서 시작하나요?"
  a: "PVE 관리 GUI의 `Datacenter` > `Ceph` 메뉴에서 `Install Ceph`를 선택합니다. 글에서는 Ceph 버전으로 Quincy를, Repository로 `No-Subscription`을 선택했습니다."
- q: "Proxmox에서 Ceph MON, MGR, OSD는 어떻게 추가하나요?"
  a: "각 노드의 `Ceph` > `Monitor` 메뉴에서 MON과 MGR을 추가하고, `Ceph` > `OSD` 메뉴의 `Create : OSD`에서 사용할 디스크를 지정해 OSD를 추가합니다."
- q: "Proxmox Ceph 구성에서 네트워크는 어떻게 나누었나요?"
  a: "Cluster 및 Ceph Public Network는 `20.20.20.0/24`, Ceph Cluster Network는 `30.30.30.0/24`, VM Network는 vmbr0를 사용했습니다."
- q: "Proxmox에서 Ceph Pool을 쓰면 어떤 이점이 있나요?"
  a: "RBD 유형의 Ceph Pool은 각 노드에서 동시에 사용할 수 있어, pve-cluster에서 VM 라이브 마이그레이션을 손쉽게 할 수 있습니다."
