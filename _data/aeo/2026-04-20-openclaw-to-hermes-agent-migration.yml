summary:
- "`hermes claw migrate`로 OpenClaw의 커스텀 스킬 16개, MEMORY.md, provider 설정 등을 Hermes Agent로 자동 이관할 수 있습니다."
- "SOUL.md 페르소나 병합, 크론 잡 재등록, 게이트웨이 전환은 자동 이관되지 않아 수동으로 처리해야 합니다."
- "이관 후 Amazon Bedrock Claude 모델 ID의 점(.)이 하이픈으로 바뀌어 호출이 실패하는 버그를 만났고, 패치 후 PR을 제출했습니다."
tested_on: "Amazon Linux 2023 (EC2), Amazon Bedrock (Claude Opus 4.6)"
faq:
- q: "OpenClaw와 Hermes Agent를 한 서버에서 함께 운영할 수 있나요?"
  a: "네. Hermes는 `~/.hermes/`, OpenClaw는 `~/.openclaw/`를 홈 디렉터리로 사용하므로 공존할 수 있습니다. 덕분에 단계적 이전과 롤백이 가능합니다."
- q: "hermes claw migrate로 이관되지 않는 항목은 무엇인가요?"
  a: "Hermes에 매핑이 없는 IDENTITY.md, TOOLS.md, 크론 잡, 멀티에이전트 라우팅은 archive 폴더에 보관되고, 이미 존재하는 SOUL.md와 모델 설정은 conflict로 덮어쓰지 않습니다. 이 항목들은 수동으로 병합하거나 재등록해야 합니다."
- q: "Hermes Agent에서 Amazon Bedrock Claude 모델 호출 시 'The provided model identifier is invalid' 오류가 나는 이유는 무엇인가요?"
  a: "`agent/anthropic_adapter.py`의 `normalize_model_name()`이 OpenRouter 포맷을 가정해 모델 ID의 점을 모두 하이픈으로 바꾸기 때문입니다. `global.anthropic.claude-opus-4-6-v1`이 `global-anthropic-claude-opus-4-6-v1`로 바뀌어 Bedrock이 인식하지 못하며, Bedrock 모델 ID일 때 치환을 건너뛰도록 패치해 해결했습니다."
- q: "이관이 끝난 뒤 OpenClaw 게이트웨이와 디렉터리는 어떻게 정리하나요?"
  a: "`systemctl --user disable --now openclaw-gateway`로 OpenClaw 게이트웨이를 비활성화하고 `hermes gateway install`, `hermes gateway start`로 전환합니다. Hermes가 안정화된 뒤 `hermes claw cleanup`을 실행하면 `~/.openclaw`가 `~/.openclaw.pre-migration`으로 이름이 바뀝니다."
