# AEO data for _posts/2020-04-17-install-nexus-ce.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "Docker 또는 Podman으로 Nexus Repository Manager 3(OSS)를 띄우고 Docker (Hosted) 저장소를 만들어 Private Container Image를 Push하는 과정을 정리합니다."
keywords:
- "Nexus Repository Manager 3"
- "sonatype/nexus3"
- "Docker (Hosted)"
- "insecure-registries"
- "Docker Bearer Token Realm"
- "Podman"
summary:
- "UID/GID 200으로 데이터 디렉터리를 만든 뒤 `sonatype/nexus3` 컨테이너를 8081, 5000 포트로 실행하면 Docker나 Podman으로 Nexus를 구성할 수 있습니다."
- "Repository 메뉴에서 `Docker (Hosted)` 저장소를 만들고 포트를 지정하면 Private Container Image 저장소로 쓸 수 있습니다."
- "Docker Host의 `/etc/docker/daemon.json`에 insecure-registries를 추가하고 `docker login`, `docker tag`, `docker push`로 이미지를 올립니다."
faq:
- q: "Nexus 초기 admin 비밀번호는 어디서 확인하나요?"
  a: "컨테이너 볼륨을 `/data`로 연결했다면 `cat /data/admin.password`로 확인합니다."
- q: "Nexus 데이터 디렉터리 권한은 어떻게 설정하나요?"
  a: "`chown 200:200 /data`처럼 UID/GID를 200으로 설정합니다. 이 값은 Nexus Container Image에 선언되어 있습니다."
- q: "Nexus Docker 저장소에서 anonymous Pull을 허용하려면 어떻게 하나요?"
  a: "저장소 설정에서 익명 사용자 Pull 권한을 설정하고, Realms 메뉴에서 `Docker Bearer Token Realm`을 추가합니다."
- q: "Nexus Private 저장소에 docker push를 하려면 Docker Host에서 무엇을 설정하나요?"
  a: "`/etc/docker/daemon.json`에 `\"insecure-registries\" : [\"192.168.200.92:5000\"]`처럼 저장소 주소를 추가한 뒤 `docker login`으로 로그인합니다."
