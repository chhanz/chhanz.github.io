# AEO data for _posts/2022-05-25-kubernetes-statefulset.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "Flask 예제 앱으로 Kubernetes StatefulSet 의 순차적 Pod 생성과 이름 규칙, Headless Service 의 DNS 규칙, Pod 재생성 시 동일 PV 재연결 동작을 확인합니다."
keywords:
- "StatefulSet"
- "Headless Service"
- "clusterIP: None"
- "volumeClaimTemplates"
- "Pod DNS"
- "local-path"
- "initContainers"
summary:
- "StatefulSet 의 Pod 는 `{StatefulSet 이름}-{0..N-1}` 형식의 고정 이름을 가지며 0, 1, 2 순서대로 생성됩니다."
- "`clusterIP: None` 인 Headless Service 를 쓰면 `{Pod 이름}.{Service 이름}.{namespace}.svc.{cluster.domain}` 으로 각 Pod 에 접근할 수 있습니다."
- "`volumeClaimTemplates` 로 Pod 마다 PVC 가 만들어지고, Pod 를 삭제해 재생성해도 같은 PV 에 다시 연결됩니다."
faq:
- q: "StatefulSet 과 Deployment 의 Pod 이름은 어떻게 다른가요?"
  a: "StatefulSet 의 Pod 이름에는 hash 값이 붙지 않고 `flask-0`, `flask-1` 처럼 `{StatefulSet 이름}-{순번}` 형식이 됩니다. Pod 도 동시에 뜨지 않고 순서대로 생성됩니다."
- q: "Headless Service 는 어떻게 만드나요?"
  a: "Service spec 의 `clusterIP` 값을 `None` 으로 지정하면 됩니다. StatefulSet 은 안정적인 네트워크 식별을 위해 Headless Service 를 사용합니다."
- q: "StatefulSet Pod 의 DNS 이름 형식은 어떻게 되나요?"
  a: "Service 는 `{Service name}.{namespace}.svc.{cluster.domain}`, 개별 Pod 는 `{Pod name}.{Service name}.{namespace}.svc.{cluster.domain}` 형식입니다. 예를 들어 `flask-0.flask.default.svc.cluster.local` 로 조회할 수 있습니다."
- q: "StatefulSet Pod 를 삭제하면 PV 데이터는 어떻게 되나요?"
  a: "Pod 가 재생성되면 이전과 같은 PVC(예: `www-flask-1`)와 PV 가 다시 연결되어 기존 데이터가 유지됩니다. 글의 테스트에서도 `dump.log` 에 이전 기록과 새 기록이 함께 남았습니다."
