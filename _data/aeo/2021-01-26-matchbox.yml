# AEO data for _posts/2021-01-26-matchbox.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "OpenShift/OKD 4 설치를 위해 matchbox를 Podman 컨테이너로 실행하고, MAC 주소별 groups와 profiles로 Fedora CoreOS 부팅 파일과 ignition을 iPXE로 제공하는 방법을 정리합니다."
keywords:
- "matchbox"
- "OpenShift 4"
- "OKD 4"
- "iPXE"
- "ignition"
- "Fedora CoreOS"
- "dhcpd"
- "PXE Boot"
summary:
- "matchbox는 MAC 주소 기반으로 OpenShift 설치에 필요한 ignition, kernel, initramfs, rootfs를 제공하는 오픈소스 솔루션입니다."
- "`cert-gen`으로 인증서를 만든 뒤 matchbox 컨테이너를 Podman으로 실행하고 `curl 127.0.0.1:8080`으로 동작을 확인합니다."
- "groups에 노드 MAC과 profile을 매핑하고 dhcpd.conf의 `filename`을 `boot.ipxe`로 지정하면 PXE 부팅으로 설치가 자동 진행됩니다."
tested_on: "matchbox v0.8.0, Fedora CoreOS 32.20201018.3.0"
faq:
- q: "matchbox는 OpenShift 설치에서 어떤 역할을 하나요?"
  a: "MAC 주소를 기준으로 각 노드에 맞는 profile의 kernel, initramfs, rootfs, ignition을 iPXE로 제공합니다. 본문은 httpd와 pxe로 배포하는 방식보다 향후 운영에도 편리하다고 설명합니다."
- q: "matchbox에서 노드별로 다른 설정을 주려면 어떻게 하나요?"
  a: "`groups` 디렉토리의 JSON에 `selector`의 `mac`으로 노드 MAC 주소를 적고 사용할 `profile`을 지정합니다. profile에는 kernel, initrd, boot args와 `ignition_id`를 정의합니다."
- q: "DHCP 서버에서 matchbox로 iPXE 부팅을 연결하려면 어떻게 하나요?"
  a: "`dhcpd.conf`에 `next-server`를 추가하고 `filename`에 matchbox의 `boot.ipxe` 주소(예: `http://20.0.0.1:8080/boot.ipxe`)를 지정합니다."
- q: "matchbox가 정상 실행됐는지 어떻게 확인하나요?"
  a: "`curl 127.0.0.1:8080`을 실행해 `matchbox`라는 응답이 나오면 정상입니다."
