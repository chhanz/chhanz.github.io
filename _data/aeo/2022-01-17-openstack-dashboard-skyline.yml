description: "kolla-ansible 로 배포한 OpenStack Wallaby 환경에 새로운 대시보드 Skyline 을 Docker 컨테이너로 배포하고 화면을 살펴본 미리보기 후기입니다."
keywords:
- "Skyline"
- "skyline-apiserver"
- "OpenStack Dashboard"
