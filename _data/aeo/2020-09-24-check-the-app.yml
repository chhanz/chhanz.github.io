# AEO data for _posts/2020-09-24-check-the-app.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "kubectl get pod, top, logs, exec, describe로 Pod 상태와 로그를 확인하고 kubectl run과 YAML로 Pod를 생성·삭제하는 방법을 정리합니다."
keywords:
- "Kubernetes Pod"
- "kubectl get pod"
- "kubectl logs"
- "kubectl exec"
- "kubectl top pod"
- "kubectl run"
- "멀티 컨테이너 Pod"
summary:
- "`kubectl get pod`, `kubectl top pod`, `kubectl describe pod`로 Pod 상태, 리소스 사용량, 상세 정보를 확인할 수 있습니다."
- "`kubectl logs -f`로 컨테이너 로그를 실시간으로 보고 `kubectl exec -ti <pod> -- <명령>`으로 컨테이너 안에서 명령을 실행합니다."
- "`kubectl run`이나 YAML로 Pod를 만들고 `kubectl delete pod`로 삭제할 수 있으며, 한 Pod에 여러 컨테이너를 넣는 예제도 있습니다."
faq:
- q: "Pod 컨테이너 로그를 실시간으로 보려면 어떻게 하나요?"
  a: "`kubectl logs -f <pod 이름>`처럼 `-f` 옵션을 추가하면 됩니다."
- q: "실행 중인 Pod 정의를 YAML 파일로 저장하려면 어떻게 하나요?"
  a: "`kubectl get pod <pod 이름> -o yaml > flask-example-app.yml`처럼 `-o yaml` 출력을 파일로 리다이렉트하면 됩니다."
- q: "Pod가 어느 노드에서 실행 중인지 확인하려면 어떻게 하나요?"
  a: "`kubectl get pod -o wide`를 실행하면 Pod IP와 NODE 열이 함께 표시됩니다."
- q: "하나의 Pod에 여러 컨테이너를 넣으려면 어떻게 작성하나요?"
  a: "Pod YAML의 `spec.containers` 아래에 nginx, redis, memcached처럼 컨테이너를 여러 개 나열하면 됩니다."
