summary:
- "개발자 옵션에서 무선 디버깅을 켜고 '페어링 코드로 기기 페어링' 정보로 `adb pair`를 먼저 실행해야 Android 16 기기에 무선으로 연결할 수 있습니다."
- "페어링 후에는 무선 디버깅 메뉴의 'IP 주소 및 포트'로 `adb connect`를 실행하며, 이 포트는 페어링용 포트와 다릅니다."
tested_on: "Android 16"
faq:
- q: "Android 16에서 adb 무선 페어링은 어떻게 하나요?"
  a: "개발자 옵션에서 무선 디버깅을 활성화하고 '페어링 코드로 기기 페어링'을 누른 뒤, 표시된 주소로 `adb pair <IP:포트>`를 실행하고 페어링 코드를 입력합니다."
- q: "adb pair와 adb connect에 같은 포트를 쓰면 되나요?"
  a: "아닙니다. 페어링용 포트와 연결용 포트는 다릅니다. 페어링 후에는 무선 디버깅 메뉴에 표시된 'IP 주소 및 포트'로 `adb connect`를 실행합니다."
- q: "adb 연결이 됐는지 어떻게 확인하나요?"
  a: "`adb devices` 같은 명령으로 장치 접속 상태를 확인합니다."
