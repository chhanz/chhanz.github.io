# AEO data for _posts/2014-07-25-hacmpforceremove.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "PowerHA(HACMP) 7.1에서 caavg_private가 삭제되지 않아 클러스터를 제거할 수 없을 때 rmcluster로 CAA 클러스터를 강제 제거하는 방법입니다."
keywords:
- "PowerHA 7.1"
- "HACMP"
- "CAA"
- "caavg_private"
- "rmcluster"
- "CAA_FORCE_ENABLED"
summary:
- "HACMP 7.1에서 CAAVG가 삭제되지 않아 클러스터를 제거하지 못할 때는 `CAA_FORCE_ENABLED=1`을 지정하고 `rmcluster -fr`로 CAA 클러스터를 강제 제거합니다."
- "`rmcluster -fr`은 양쪽 노드에서 각 노드의 caavg_private 디스크를 지정해 실행합니다."
- "그래도 제거되지 않으면 한 노드에서 해당 디스크를 `dd`로 초기화하고 양쪽 노드를 재부팅합니다."
tested_on: "PowerHA (HACMP) 7.1"
faq:
- q: "PowerHA 7.1에서 CAA 클러스터를 강제로 제거하는 명령은 무엇인가요?"
  a: "`export CAA_FORCE_ENABLED=1; rmcluster -fr <hdisk>`를 실행합니다. `<hdisk>`에는 `lspv | grep caavg`로 확인한 caavg_private 디스크를 지정하며, 양쪽 노드에서 모두 실행합니다."
- q: "rmcluster로도 CAA 클러스터가 제거되지 않으면 어떻게 하나요?"
  a: "한 노드에서 `dd if=/dev/zero of=/dev/hdiskpowerXXX bs=1024k count=100`으로 CAA 디스크를 초기화한 뒤 양쪽 노드를 재부팅합니다. 글쓴이 경험상 대부분은 첫 번째 rmcluster 방법으로 해결되었습니다."
- q: "caavg_private가 남아 있으면 어떤 문제가 생기나요?"
  a: "기존 클러스터를 제거할 수 없고 새 HA 클러스터 생성도 실패합니다."
