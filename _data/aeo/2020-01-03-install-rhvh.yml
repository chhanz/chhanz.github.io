description: "RHVH 4.1 DVD 이미지로 Red Hat Virtualization Host를 설치하고 nodectl check로 상태를 확인하는 과정을 화면 순서대로 정리합니다."
keywords:
- "RHVH"
- "Red Hat Virtualization Host"
- "RHV 4.1"
- "하이퍼바이저"
- "nodectl check"
summary:
- "RHVH는 Red Hat Enterprise Linux 기반의 최소 운영 체제로, Red Hat Virtualization 환경에서 하이퍼바이저 역할을 하는 물리 시스템을 간단하게 설정할 수 있습니다."
- "RHVH 4.1 DVD로 부팅한 뒤 DATE & TIME, KEYBOARD, INSTALLATION DESTINATION과 필요 시 Network/Hostname, root 비밀번호를 설정해 설치합니다."
- "설치 후 재부팅하면 `nodectl check` 명령으로 시스템 상태를 확인할 수 있습니다."
tested_on: "Red Hat Virtualization Host (RHVH) 4.1"
faq:
- q: "Red Hat Virtualization Host(RHVH)란 무엇인가요?"
  a: "Red Hat Enterprise Linux 기반의 최소 운영 체제입니다. RHV 환경에서 하이퍼바이저 역할을 하는 물리 시스템을 간단히 설정할 수 있도록 설계되었습니다."
- q: "RHVH 설치 후 시스템 상태는 어떻게 확인하나요?"
  a: "RHVH 부팅이 끝나면 `nodectl check` 명령으로 시스템 상태를 확인합니다."
- q: "RHVH 설치 화면에서 기본으로 설정할 항목은 무엇인가요?"
  a: "`DATE & TIME`, `KEYBOARD`, `INSTALLATION DESTINATION`을 기본으로 설정하고 필요에 따라 Network 및 Hostname을 설정합니다. 설치가 시작되면 root 비밀번호를 지정합니다."
