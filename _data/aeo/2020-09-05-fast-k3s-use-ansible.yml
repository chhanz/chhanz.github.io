# AEO data for _posts/2020-09-05-fast-k3s-use-ansible.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "Ansible Playbook(ansible.fast-k3s)으로 vCenter 템플릿에서 VM을 프로비저닝하고 k3s를 자동 배포해 Kubernetes 테스트 환경을 만드는 방법을 소개합니다."
keywords:
- "k3s"
- "Ansible"
- "ansible.fast-k3s"
- "vCenter"
- "vmware_guest"
- "pyvmomi"
- "Lightweight Kubernetes"
summary:
- "ansible.fast-k3s Playbook으로 vCenter 템플릿에서 VM을 만들고 k3s까지 한 번에 배포해 테스트 환경을 구성할 수 있습니다."
- "`vm_information.yml`에 vCenter, VM 템플릿, 네트워크 정보를 입력하고 `ansible-playbook -i inventory deploy-k3s.yml`을 실행합니다."
- "`-t vm` 또는 `-t k3s` 태그로 VM 생성이나 k3s 설치만 따로 실행할 수 있습니다."
tested_on: "vCenter 6.7, CentOS 7.7 Minimal 템플릿, Ansible 2.9.6, k3s v1.18.8+k3s1"
faq:
- q: "ansible.fast-k3s를 쓰려면 어떤 환경이 필요한가요?"
  a: "vCenter 6.7, CentOS 7.7 Minimal 설치 템플릿, Static IP, Ansible 2.9.6 이상에서 테스트되었습니다. Ansible로 VMware를 제어하려면 `pip install -r requirements.txt`로 pyvmomi 7.0 이상도 설치해야 합니다."
- q: "VMware가 아닌 하이퍼바이저에서는 k3s만 설치할 수 있나요?"
  a: "가능합니다. `ansible-playbook -i inventory deploy-k3s.yml -t k3s`처럼 k3s 태그만 지정해 실행하면 VM 프로비저닝 없이 k3s만 배포됩니다."
- q: "vmware_guest 모듈로 Ubuntu를 배포하면 Static IP가 설정되지 않는 이유는 무엇인가요?"
  a: "open-vm-tools가 아직 netplan을 이용한 네트워크 설정을 지원하지 않기 때문입니다."
