# AEO data for _posts/2019-03-31-linux-raw-device-generator-script.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "CentOS 7에서 Multipath mpath 장치의 DM_UUID로 raw device용 60-raw.rules 파일을 자동 생성하는 스크립트 사용법을 소개합니다."
keywords:
- "raw device"
- "Multipath"
- "mpath"
- "DM_UUID"
- "60-raw.rules"
- "udev"
- "raw_generator_v1.sh"
summary:
- "raw_generator_v1.sh 스크립트를 실행하면 Multipath mpath 장치의 DM_UUID를 기준으로 60-raw.rules.<날짜> 파일이 자동 생성됩니다."
- "생성된 규칙 파일을 /etc/udev/rules.d/에 넣으면 많은 mpath 장치를 오타 없이 raw device로 만들 수 있습니다."
- "생성된 규칙에는 /dev/raw/rawN 매핑과 함께 raw 장치의 OWNER=grid, GROUP=dba, MODE=0660 권한 설정이 포함됩니다."
faq:
- q: "많은 mpath 장치를 raw device로 만들 때 udev 규칙을 자동으로 만들 수 있나요?"
  a: "네, raw_generator_v1.sh 스크립트를 실행하면 mpath 장치별 DM_UUID로 `60-raw.rules.<날짜>` 파일을 만들어 줍니다. 수작업으로 규칙을 쓸 때 생기는 오타를 줄일 수 있습니다."
- q: "생성된 60-raw.rules 파일은 어떻게 적용하나요?"
  a: "생성된 파일을 /etc/udev/rules.d/ 에 넣고 raw device 생성을 진행합니다. 자세한 raw device 생성 절차는 이전 포스팅을 참고하도록 안내하고 있습니다."
