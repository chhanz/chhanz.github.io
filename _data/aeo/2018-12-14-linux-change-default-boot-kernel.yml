# AEO data for _posts/2018-12-14-linux-change-default-boot-kernel.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
keywords:
- "grub2-set-default"
- "GRUB2"
- "grubenv"
- "saved_entry"
- "/etc/grub2.cfg"
- "menuentry"
- "CentOS 7"
summary:
- "콘솔에 접근할 수 없는 원격 환경에서도 `grub2-set-default <Entry 번호>`로 다음 부팅 커널을 지정할 수 있습니다."
- "Entry 번호는 `/etc/grub2.cfg`의 menuentry 목록 순서대로 0부터 매겨지며, 변경 결과는 `/boot/grub2/grubenv`의 saved_entry에 기록됩니다."
- "커널 업데이트 후 이전 커널 버전으로 되돌릴 때 주로 활용할 수 있습니다."
tested_on: "CentOS 7 (kernel 3.10.0-957.1.3.el7.x86_64, 3.10.0-862.el7.x86_64)"
faq:
- q: "RHEL/CentOS 7에서 기본 부팅 커널을 바꾸는 명령은 무엇인가요?"
  a: "`grub2-set-default <Entry 번호>`입니다. 글에서는 `grub2-set-default 2`로 3.10.0-862.el7 커널을 지정한 뒤 재부팅했습니다."
- q: "GRUB 메뉴의 Kernel Entry 번호는 어떻게 확인하나요?"
  a: "`cat /etc/grub2.cfg | grep \"menuentry \" | awk -F\"'\" '{print $2}'`로 menuentry 제목 목록을 출력하고, 위에서부터 0, 1, 2 순서로 번호를 매깁니다."
- q: "기본 부팅 커널이 바뀌었는지 어떻게 확인하나요?"
  a: "`/boot/grub2/grubenv`의 `saved_entry` 값을 확인하고, 재부팅 후 `uname -a`로 실제 부팅된 커널 버전을 확인합니다."
