# AEO data for _posts/2026-09-02-kirocrew.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
keywords:
- "KiroCrew"
- "kiro-cli"
- "ACP"
- "kirocrew service install"
- "KIROCREW_PORT"
- "Telegram Bot"
