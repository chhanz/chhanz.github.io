- "스티어링"
summary:
- "KiroCrew를 설치 스크립트로 설치하고 `kirocrew service install`로 systemd 서비스에 등록하면 EC2에 상주형 AI 에이전트 Gateway를 운영할 수 있습니다."
- "대시보드는 루프백(127.0.0.1)에만 바인딩되므로, 데스크톱 앱의 원격 Crew 기능으로 SSH 터널을 통해 원격 Gateway에 접속합니다."
- "텔레그램 봇 토큰과 허용 사용자 ID를 등록한 뒤 `kirocrew restart`로 재시작하면 텔레그램 채널로 같은 에이전트를 사용할 수 있습니다."
tested_on: "Amazon Linux 2023 (EC2), KiroCrew 0.4.1rc1, kiro-cli"
faq:
- q: "KiroCrew를 쓰려면 별도의 LLM API 키가 필요한가요?"
  a: "아닙니다. KiroCrew는 ACP(Agent Client Protocol)로 kiro-cli를 구동해 LLM을 호출하므로 kiro-cli 로그인 계정을 그대로 사용합니다."
- q: "KiroCrew 서비스의 기본 포트를 바꾸려면 어떻게 하나요?"
  a: "`KIROCREW_PORT=5477 kirocrew service install`처럼 설치 시점에 `KIROCREW_PORT`를 지정합니다. 이 값은 서비스 유닛에 그대로 반영되며 기본 포트는 5476입니다."
- q: "KiroCrew 대시보드에 외부에서 접속이 안 되는 이유는 무엇인가요?"
  a: "대시보드가 기본적으로 `0.0.0.0`이 아닌 `127.0.0.1`에만 바인딩되기 때문입니다. SSH 터널이나 별도 설정으로 접근해야 하며, 데스크톱 앱의 원격 Crew는 키 기반 SSH 설정을 이용해 연결합니다."
- q: "KiroCrew 텔레그램 봇이 응답하지 않으면 무엇을 확인해야 하나요?"
  a: "`~/.kiro/crew/config.json`의 `allowed_user_ids`에 허용할 사용자 숫자 ID가 등록되어 있는지 확인합니다. 비워두면 모든 요청이 거부되며, 설정 저장 후에는 `kirocrew restart`로 재시작해야 채널이 기동됩니다."
