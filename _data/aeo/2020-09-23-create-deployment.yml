# AEO data for _posts/2020-09-23-create-deployment.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "kubectl create deployment로 Flask 예제 이미지를 Deployment로 배포하고 kubectl get all, kubectl describe로 Pod와 ReplicaSet 상태를 확인하는 방법을 정리합니다."
keywords:
- "Kubernetes Deployment"
- "kubectl create deployment"
- "kubectl get all"
- "kubectl describe deployment"
- "ReplicaSet"
- "RollingUpdate"
summary:
- "`kubectl create deployment --image=han0495/flask-example-app:v1 flask-example-app`으로 애플리케이션을 Deployment로 배포합니다."
- "`kubectl get all`로 Deployment와 함께 생성된 Pod, ReplicaSet이 정상 실행 중인지 확인합니다."
- "`kubectl describe deployment`로 Replicas 수, 이미지, RollingUpdate 전략 같은 상세 정보를 볼 수 있습니다."
faq:
- q: "Kubernetes Deployment는 어떤 역할을 하나요?"
  a: "Deployment는 Kubernetes가 애플리케이션 인스턴스를 어떻게 생성하고 업데이트할지 지시합니다. Deployment가 만들어지면 Kubernetes Master가 인스턴스를 클러스터의 개별 노드에 스케줄합니다."
- q: "kubectl로 Deployment를 만들면 어떤 리소스가 함께 생성되나요?"
  a: "Deployment와 함께 ReplicaSet과 Pod가 생성됩니다. `kubectl get all`로 한 번에 확인할 수 있습니다."
- q: "Deployment의 업데이트 전략은 어디서 확인하나요?"
  a: "`kubectl describe deployment flask-example-app` 결과의 StrategyType과 RollingUpdateStrategy 항목에서 확인합니다. 본문 예제는 `RollingUpdate`, `25% max unavailable, 25% max surge`로 표시됩니다."
