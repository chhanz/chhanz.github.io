# AEO data for _posts/2020-09-24-check-the-node.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "kubectl get node, kubectl top nodes로 Kubernetes 노드 상태와 사용량을 확인하고 cordon, uncordon, drain으로 노드 스케줄링을 관리하는 방법을 정리합니다."
keywords:
- "Kubernetes Node"
- "kubectl get node"
- "kubectl top nodes"
- "kubectl cordon"
- "kubectl drain"
- "Kubelet"
- "k3s"
summary:
- "`kubectl get node -o wide`로 노드 상태, 버전, OS 이미지, 커널, 컨테이너 런타임까지 확인할 수 있습니다."
- "`kubectl top nodes`로 노드별 CPU와 메모리 사용량을 볼 수 있습니다."
- "`kubectl cordon`과 `uncordon`으로 노드 스케줄 가능 여부를 바꾸고, `kubectl drain`으로 유지보수 전에 노드를 비웁니다."
tested_on: "k3s v1.18.8+k3s1, CentOS Linux 7 (Core), containerd 1.3.3-k3s2"
faq:
- q: "kubectl cordon과 drain의 차이는 무엇인가요?"
  a: "`kubectl cordon`은 노드를 스케줄 불가(unschedulable)로 표시만 하고, `kubectl drain`은 유지보수를 위해 노드를 drain합니다. 다시 스케줄을 허용하려면 `kubectl uncordon`을 사용합니다."
- q: "노드의 컨테이너 런타임과 커널 버전은 어떻게 확인하나요?"
  a: "`kubectl get node -o wide`를 실행하면 OS-IMAGE, KERNEL-VERSION, CONTAINER-RUNTIME 열이 함께 표시됩니다."
- q: "Kubernetes 노드에서 Kubelet은 어떤 역할을 하나요?"
  a: "Kubelet은 쿠버네티스 마스터와 노드 간 통신을 책임지는 프로세스이며, 해당 머신에서 동작하는 Pod와 컨테이너를 관리합니다."
