# AEO data for _posts/2022-05-09-ubuntu-apt-mirror-issue.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
keywords:
- "apt-mirror"
- "Stifler6996/apt-mirror"
- "apt-get update"
- "404 File not found"
- "cnf Commands-amd64"
- "Ubuntu 22.04 jammy"
summary:
- "apt-mirror 로 sync 한 저장소의 `cnf/Commands-amd64` 404 오류는 공식 apt-mirror 가 신규 Ubuntu Release 에서 제대로 동작하지 않아 발생합니다."
- "공식 apt-mirror 를 fork 해 수정한 `Stifler6996/apt-mirror` 로 `/usr/bin/apt-mirror` 를 교체하면 신규 Release 도 정상적으로 sync 됩니다."
tested_on: "Ubuntu 22.04 (jammy)"
faq:
- q: "apt-mirror 로 sync 한 뒤 apt-get update 에서 c-n-f Metadata 404 오류가 나는 이유는 무엇인가요?"
  a: "공식 apt-mirror 는 마지막 commit 이 3년 전이라 신규 Ubuntu Release 에서 정상 동작하지 않는 이슈가 있기 때문입니다. `i386` 과 `amd64` 패키지를 sync 하지 않은 경우에도 같은 오류가 날 수 있습니다."
- q: "apt-mirror 의 cnf 404 오류는 어떻게 해결하나요?"
  a: "fork 버전인 `https://github.com/Stifler6996/apt-mirror` 를 clone 하고, 기존 `/usr/bin/apt-mirror` 를 백업한 뒤 fork 의 `apt-mirror` 파일로 교체합니다. 이후 다시 sync 하면 됩니다."
- q: "fork 버전 apt-mirror 로 교체할 때 권한은 어떻게 설정하나요?"
  a: "복사한 파일에 `sudo chmod 755 /usr/bin/apt-mirror` 와 `sudo chown root:root /usr/bin/apt-mirror` 를 적용합니다."
