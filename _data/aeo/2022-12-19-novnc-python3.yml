# AEO data for _posts/2022-12-19-novnc-python3.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "RHEL 8(python3) 환경에서 tigervnc-server와 python3-websockify로 noVNC를 구성해 웹브라우저로 VNC에 접속하는 방법입니다."
keywords:
- "noVNC"
- "websockify"
- "python3-websockify"
- "tigervnc-server"
- "RHEL 8"
- "EPEL"
- "vncserver"
summary:
- "RHEL 8에서 EPEL을 추가하고 `novnc`, `python3-websockify`, `tigervnc-server`를 설치하면 python3 기반으로 noVNC를 구성할 수 있습니다."
- "`vncserver :1`을 실행한 뒤 `websockify -D --web=/usr/share/novnc/ 80 localhost:5901`로 80 포트에서 noVNC 서비스를 띄웁니다."
- "서버 IP로 접속해 vnc password를 입력하면 VNC Viewer 없이 웹브라우저에서 VNC 화면을 사용할 수 있습니다."
tested_on: "AWS EC2 RHEL 8.6"
faq:
- q: "RHEL 8에서 noVNC 구성에 필요한 패키지는 무엇인가요?"
  a: "GNOME 그룹과 EPEL 저장소를 설치한 뒤 `sudo dnf -y install novnc python3-websockify python3-numpy tigervnc-server`로 설치합니다."
- q: "noVNC 웹 서비스를 80 포트로 띄우려면 어떻게 하나요?"
  a: "`vncserver :1`로 VNC 서버를 시작한 뒤 `sudo websockify -D --web=/usr/share/novnc/ 80 localhost:5901`을 실행합니다. 그러면 websockify가 daemon으로 80 포트에서 noVNC를 제공합니다."
- q: "noVNC 접속 시 입력하는 password는 어디서 정하나요?"
  a: "`vncserver`를 처음 시작할 때 입력을 요구하는 vnc 접속용 password입니다. noVNC 화면에서 연결을 누르면 이 password를 입력합니다."
