# AEO data for _posts/2023-04-24-al2-docker-buildx.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "Amazon Linux 2의 docker 패키지에 포함된 buildx 플러그인으로 linux/amd64, linux/arm64 멀티 플랫폼 컨테이너 이미지를 빌드하고 테스트한 방법입니다."
keywords:
- "docker buildx"
- "Amazon Linux 2"
- "멀티 플랫폼 빌드"
- "docker-buildx"
- "docker-container driver"
- "linux/arm64"
- "amazon-linux-extras"
summary:
- "Amazon Linux 2는 `amazon-linux-extras`로 docker만 설치하면 별도 패키지 없이 buildx 플러그인이 활성화되어 있습니다."
- "`docker-container` driver로 builder를 만들고 `--platform linux/amd64,linux/arm64`로 빌드해 Docker Hub에 push할 수 있습니다."
- "같은 이미지를 x86(t2.micro)과 ARM(t4g.small) 인스턴스에서 실행하면 호스트 아키텍처에 맞는 이미지가 사용됩니다."
tested_on: "Amazon Linux 2, docker 20.10.23-1.amzn2.0.1 (buildx v0.10.4), t2.micro / t4g.small"
faq:
- q: "Amazon Linux 2에서 docker buildx를 쓰려면 별도 패키지를 설치해야 하나요?"
  a: "필요 없습니다. CentOS나 Ubuntu는 `docker-buildx-plugin` 패키지를 설치해야 하지만, Amazon Linux 2는 docker 패키지에 `/usr/libexec/docker/cli-plugins/docker-buildx`가 포함되어 있습니다."
- q: "docker buildx로 멀티 플랫폼 이미지를 빌드하려면 어떻게 하나요?"
  a: "`docker buildx create --name test --driver docker-container`로 builder를 만들고 `docker buildx use test`로 선택한 뒤 `docker buildx build --platform linux/amd64,linux/arm64 -t <이미지> . --push`를 실행합니다. push 전에 `docker login`이 필요합니다."
- q: "Amazon Linux 2 docker 패키지에 포함된 buildx 버전은 어떻게 확인하나요?"
  a: "`yum changelog all docker`로 확인할 수 있으며, 글 작성 시점의 docker-20.10.23-1.amzn2.0.1 패키지에는 buildx v0.10.4가 포함되어 있었습니다."
