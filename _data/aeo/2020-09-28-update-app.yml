# AEO data for _posts/2020-09-28-update-app.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "kubectl set image로 Deployment 이미지를 v1에서 v2로 Rolling Update하고, kubectl rollout undo로 직전 또는 특정 리비전으로 Rollback하는 방법을 정리합니다."
keywords:
- "Rolling Update"
- "Rollback"
- "kubectl set image"
- "kubectl rollout status"
- "kubectl rollout undo"
- "kubectl rollout history"
- "ImagePullBackOff"
summary:
- "`kubectl set image`로 Deployment 이미지를 v2로 바꾸면 기존 Pod가 순차적으로 교체되며 Rolling Update가 진행됩니다."
- "없는 `v99` 태그로 업데이트해 새 Pod가 ImagePullBackOff에 빠지면 `kubectl rollout undo`로 직전 버전으로 되돌립니다."
- "`kubectl rollout history`로 리비전을 확인하고 `--to-revision=1`을 지정하면 처음 버전(v1)으로 Rollback할 수 있습니다."
faq:
- q: "Rolling Update 진행 상태는 어떻게 확인하나요?"
  a: "`kubectl rollout status deployments flask-example-app`을 실행하면 진행 상황이 표시되고, 완료되면 `successfully rolled out` 메시지가 나옵니다."
- q: "잘못된 이미지 태그로 업데이트해 Pod가 ImagePullBackOff 상태가 되면 어떻게 하나요?"
  a: "`kubectl rollout undo deployment flask-example-app`으로 직전 리비전으로 Rollback합니다. 본문 예제에서는 존재하지 않는 `v99` 태그로 ErrImagePull/ImagePullBackOff가 발생했고, Rollback 후 v2 이미지로 돌아왔습니다."
- q: "특정 리비전으로 Rollback하려면 어떻게 하나요?"
  a: "`kubectl rollout history deployment flask-example-app`으로 리비전 번호를 확인한 뒤 `kubectl rollout undo deployment flask-example-app --to-revision=1`처럼 번호를 지정합니다."
- q: "Rolling Update 도중에는 서비스 응답이 어떻게 보이나요?"
  a: "업데이트가 진행되는 동안 v1과 v2 Pod가 섞여 응답합니다. 본문 예제에서도 curl 반복 요청에 `v=1`과 `v=2` 응답이 함께 출력되었습니다."
