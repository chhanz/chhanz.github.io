# AEO data for _posts/2023-05-15-al2023-crontab.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "Amazon Linux 2023에서 crontab: command not found 오류가 날 때 cronie 패키지를 설치해 crontab 명령을 사용하는 방법입니다."
keywords:
- "Amazon Linux 2023"
- "crontab: command not found"
- "cronie"
- "yum provides"
- "EC2 Image Builder"
summary:
- "Amazon Linux 2023에는 crontab이 기본 설치되어 있지 않아 `crontab: command not found` 오류가 발생합니다."
- "`sudo yum -y install cronie`로 crontab을 제공하는 cronie 패키지를 설치하면 바로 crontab 명령을 사용할 수 있습니다."
tested_on: "Amazon Linux 2023, cronie-1.5.7-1.amzn2023.0.2"
faq:
- q: "Amazon Linux 2023에서 crontab 명령이 없다고 나오면 어떻게 하나요?"
  a: "`sudo yum -y install cronie`로 cronie 패키지를 설치합니다. 설치 후 `crontab -l`을 실행하면 정상 동작합니다."
- q: "crontab 명령은 어떤 패키지에 포함되어 있나요?"
  a: "`sudo yum provides crontab`으로 확인하면 `/usr/bin/crontab`을 제공하는 패키지는 cronie입니다."
- q: "EC2 Image Builder로 AL2023 AMI를 빌드할 때 crontab 때문에 실패하는 이유는 무엇인가요?"
  a: "Amazon Linux 2와 달리 AL2023 AMI에는 cronie가 기본 설치되어 있지 않아 crontab 명령이 실행되지 않기 때문입니다. 빌드 과정에서 cronie를 먼저 설치하면 됩니다."
