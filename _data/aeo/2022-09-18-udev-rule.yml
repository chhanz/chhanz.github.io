# AEO data for _posts/2022-09-18-udev-rule.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
keywords:
- "udev"
- "udevadm info"
- "udev rules"
- "/etc/udev/rules.d"
- "systemd-udevd"
- "udevadm trigger"
- "read_ahead_kb"
summary:
- "`udevadm info -a`로 확인한 장치 속성을 바탕으로 `/etc/udev/rules.d`에 rule을 작성해 디스크 파라미터나 네트워크 인터페이스 이름을 설정할 수 있습니다."
- "작성한 rule은 `udevadm control --reload`로 다시 읽고 `udevadm trigger --action=add` 또는 `--action=change`로 적용합니다."
- "rule이 적용되지 않으면 `systemd-udevd` 로그를 확인하며, 인터페이스 이름은 unique해야 하므로 이미 쓰이는 이름으로는 바꿀 수 없습니다."
faq:
- q: "udev rule로 SSD의 read_ahead_kb 값을 설정하려면 어떻게 하나요?"
  a: "`/etc/udev/rules.d/99-ssd.rules`에 `ACTION==\"add|change\", SUBSYSTEM==\"block\", ATTRS{model}==\"Samsung SSD*\", ATTR{queue/read_ahead_kb}=\"2048\"`처럼 작성합니다. `RUN+=`을 쓰면 `hdparm -W 0` 같은 명령도 실행할 수 있습니다."
- q: "udev rule로 이더넷 인터페이스 이름을 eth0으로 바꾸려면 어떻게 하나요?"
  a: "`/etc/udev/rules.d/70-persistent-network.rules`에 `ATTR{address}`로 MAC Address를, `KERNEL==\"ens*\"`로 장치를 매칭하고 `NAME=\"eth0\"`을 지정하는 rule을 작성합니다."
- q: "udev에서 'Error changing net interface name ... File exists' 오류는 왜 발생하나요?"
  a: "바꾸려는 이름을 다른 인터페이스가 이미 사용 중이기 때문입니다. 해당 이름을 쓰는 인터페이스를 먼저 다른 이름으로 바꾼 뒤 원하는 인터페이스의 이름을 변경해야 합니다."
- q: "udev rule을 수정한 뒤 재부팅 없이 적용하려면 어떻게 하나요?"
  a: "`udevadm control --reload`로 rule을 다시 읽고 `udevadm trigger --action=add` 또는 `udevadm trigger --action=change`를 실행합니다."
