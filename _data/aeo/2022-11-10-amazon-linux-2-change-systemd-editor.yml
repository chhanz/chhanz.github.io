# AEO data for _posts/2022-11-10-amazon-linux-2-change-systemd-editor.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "Amazon Linux 2에서 systemctl edit 실행 시 nano 대신 vi가 열리도록 SYSTEMD_EDITOR 환경 변수를 설정하는 방법입니다."
keywords:
- "SYSTEMD_EDITOR"
- "systemctl edit"
- "Amazon Linux 2"
- "nano"
- "vi"
- "override.conf"
summary:
- "Amazon Linux 2에서 `systemctl edit`이 nano로 열린다면 `SYSTEMD_EDITOR` 환경 변수를 vi 경로로 지정해 바꿀 수 있습니다."
- "`~/.bashrc`에 `export SYSTEMD_EDITOR` 설정을 추가하고 Shell에 다시 로그인하면 `systemctl edit`이 vi로 열립니다."
tested_on: "Amazon Linux 2 (EC2)"
faq:
- q: "Amazon Linux 2에서 systemctl edit이 nano로 열리는 것을 vi로 바꾸려면 어떻게 하나요?"
  a: "`~/.bashrc`에 `export SYSTEMD_EDITOR=\"$(which vi)\"` 설정을 추가하고 Shell에 다시 로그인합니다. 이후 `sudo systemctl edit network`처럼 실행하면 vi로 열립니다."
- q: "Amazon Linux 2는 OS 전체 기본 editor가 nano인가요?"
  a: "그렇지 않습니다. `systemctl edit`만 nano로 열리고 `crontab -e`는 vi로 열립니다."
