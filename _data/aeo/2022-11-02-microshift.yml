# AEO data for _posts/2022-11-02-microshift.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "CentOS Stream 8에 CRI-O와 MicroShift를 설치하고, flannel Pod의 keyPaths 오류를 해결한 뒤 샘플 앱을 배포해본 MicroShift 사용기입니다."
keywords:
- "MicroShift"
- "CRI-O"
- "CentOS Stream 8"
- "oc"
- "flannel"
- "policy.json keyPaths"
- "Lightweight OpenShift"
summary:
- "CentOS Stream 8에 CRI-O 1.21.7 저장소를 직접 등록해 설치하고, copr 저장소로 MicroShift를 설치해 경량 OpenShift 환경을 구성할 수 있습니다."
- "flannel Pod의 `Unknown key \"keyPaths\"` 오류는 `policy.json`의 `keyPaths`를 `keyPath`로 바꾸고 MicroShift를 재시작해 해결합니다."
- "ImageStream이 없어 `oc new-app`은 동작하지 않았지만, Deployment와 NodePort 서비스로 미리 만든 컨테이너 이미지 앱은 정상 배포되었습니다."
tested_on: "CentOS Stream 8, CRI-O 1.21.7, MicroShift (Kubernetes v1.21.0)"
faq:
- q: "MicroShift에서 flannel Pod가 Running 되지 않고 'Unknown key \"keyPaths\"' 오류가 나면 어떻게 하나요?"
  a: "`/etc/containers/policy.json`에서 `keyPaths` 항목을 단일 경로를 쓰는 `keyPath`로 바꾼 뒤 MicroShift를 재시작합니다. cri-o 이슈 #6197을 참고한 해결 방법입니다."
- q: "MicroShift 설치 시 공식 문서대로 cri-o가 설치되지 않으면 어떻게 하나요?"
  a: "cri-o 저장소가 실제로 등록되어 있지 않은 경우입니다. opensuse의 `devel:kubic:libcontainers:stable` 저장소와 `cri-o:1.21:1.21.7` 저장소 repo 파일을 `/etc/yum.repos.d`에 내려받은 뒤 `dnf -y install cri-o cri-tools`로 설치합니다."
- q: "MicroShift를 oc 명령으로 제어하려면 kubeconfig를 어떻게 설정하나요?"
  a: "OpenShift client(`oc`, `kubectl`)를 설치한 뒤 `/var/lib/microshift/resources/kubeadmin/kubeconfig` 내용을 `~/.kube/config`로 복사합니다."
- q: "MicroShift에서 oc new-app 명령을 쓸 수 있나요?"
  a: "테스트 환경에서는 정상 동작하지 않았습니다. MicroShift에 OpenShift의 ImageStream이 포함되어 있지 않기 때문이며, 대신 미리 만든 이미지로 Deployment를 생성해 배포했습니다."
