# AEO data for _posts/2020-06-18-ocp4-deploy-image.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "OpenShift 4.4에서 Web Console과 oc CLI로 Container Image 기반 Django WebApp을 배포하고 직접 빌드한 httpd 이미지를 배포하는 실습을 정리합니다."
keywords:
- "OpenShift 4.4"
- "oc new-app"
- "blog-django-py"
- "Container Image"
- "SCC"
- "Dockerfile"
summary:
- "developer 계정으로 Web Console에서 새 Project를 만들고 `openshiftkatacoda/blog-django-py` 이미지를 지정해 Django WebApp을 배포합니다."
- "CLI에서는 `oc new-app`으로 같은 이미지를 배포하고 `oc expose svc/blog-from-image`로 Route를 만들 수 있습니다."
- "httpd:2.4 기반 Dockerfile로 이미지를 빌드해 Docker Hub에 push한 뒤 배포하며, 배포에 문제가 생기면 SCC를 확인합니다."
tested_on: "OpenShift 4.4"
faq:
- q: "OpenShift 4.4에서 CLI로 Container Image를 배포하려면 어떻게 하나요?"
  a: "`oc login -u developer`와 `oc project`로 Project를 선택한 뒤 `oc new-app <이미지> --name <앱 이름>`으로 배포하고 `oc expose svc/<앱 이름>`으로 Route를 만듭니다."
- q: "직접 빌드한 이미지를 OpenShift에 배포했는데 문제가 생기면 무엇을 확인하나요?"
  a: "SCC(Security Context Constraints)를 확인합니다."
- q: "OpenShift 실습용 간단한 httpd 이미지는 어떻게 만드나요?"
  a: "`FROM httpd:2.4`, `COPY index.html /usr/local/apache2/htdocs/`, `EXPOSE 80`으로 된 Dockerfile을 `docker build -t <계정>/sample-httpd .`로 빌드하고 `docker push`로 Docker Hub에 올립니다."
