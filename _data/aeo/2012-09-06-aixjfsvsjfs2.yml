# AEO data for _posts/2012-09-06-aixjfsvsjfs2.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
keywords:
- "JFS"
- "JFS2"
- "AIX"
- "B-tree 디렉토리"
- "동적 inode 할당"
- "온라인 조각 모음"
- "IA64"
- "POWER"
summary:
- "JFS2는 JFS의 업그레이드 버전으로, 아키텍처상 최대 파일 크기 1PB와 최대 파일 시스템 크기 4PB를 지원합니다(JFS는 64GB, 1TB)."
- "JFS2는 inode를 디스크 공간에 따라 동적으로 할당하고 큰 디렉토리에 B-tree 구조를 써서, 생성 시 inode가 고정되는 JFS보다 확장성이 좋습니다."
- "POWER 시스템에서는 JFS와 JFS2를 모두 쓸 수 있지만 IA64 시스템에서는 JFS2만 사용할 수 있습니다."
faq:
- q: "JFS와 JFS2의 최대 파일 크기는 얼마인가요?"
  a: "아키텍처상 최대 파일 크기는 JFS2가 1PB, JFS가 64GB입니다. 테스트된 최대 파일 크기는 JFS2가 1TB, JFS가 64GB입니다."
- q: "JFS2에서 inode 수는 어떻게 결정되나요?"
  a: "JFS2는 디스크 공간 범위 안에서 inode를 동적으로 할당합니다. JFS는 파일 시스템을 만들 때 inode 수가 고정됩니다."
- q: "JFS2는 마운트된 상태에서 조각 모음을 할 수 있나요?"
  a: "네, JFS2는 마운트되어 사용 중인 파일 시스템의 온라인 조각 모음(defragmentation)을 지원합니다. 이를 통해 I/O 속도와 공간 효율을 높일 수 있습니다."
