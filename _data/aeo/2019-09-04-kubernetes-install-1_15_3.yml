description: "CentOS 7.6에서 Kubernetes Preinstaller playbook과 kubeadm으로 Master 1대, Worker 2대의 Kubernetes v1.15.3 클러스터를 구성합니다."
keywords:
- "kubeadm"
- "Kubernetes v1.15.3"
- "kubeadm init"
- "kubeadm join"
- "Calico CNI"
- "Kubernetes Preinstaller"
