# AEO data for _posts/2026-06-23-bedrock-agentcore-web-search-hermes.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
keywords:
- "Amazon Bedrock AgentCore"
- "AgentCore Gateway"
- "AgentCore Web Search"
- "MCP"
- "mcp-proxy-for-aws"
- "SigV4"
- "InvokeWebSearch"
- "Hermes Agent"
summary:
- "별도 Runtime 없이 AgentCore Gateway에 Web Search 타겟만 추가하면 웹 검색을 MCP 엔드포인트로 노출해 AI 에이전트에서 MCP 도구처럼 호출할 수 있습니다."
- "게이트웨이 서비스 롤(`InvokeWebSearch`)과 호출자 롤(`InvokeGateway`)을 구분해 권한을 주고, mcp-proxy-for-aws가 stdio 요청을 SigV4로 서명해 게이트웨이로 전달합니다."
- "연동 후 `web-search-tool___WebSearch` 도구에 `query`를 전달하면 제목, URL, 게시일, 본문 요약이 담긴 JSON 결과가 반환됩니다."
tested_on: "Amazon Linux 2023 (kernel 6.1.x), us-east-1, mcp-proxy-for-aws 1.6.2"
faq:
- q: "AgentCore Web Search를 쓰려면 별도 Runtime을 만들어야 하나요?"
  a: "아닙니다. AgentCore Gateway를 MCP 프로토콜과 AWS_IAM 인증으로 생성하고 Web Search 타겟만 추가하면 됩니다. 게이트웨이가 MCP 서버 역할을 합니다."
- q: "게이트웨이 서비스 롤과 호출자 롤은 어떻게 다른가요?"
  a: "서비스 롤은 게이트웨이가 Web Search 백엔드를 호출할 때 쓰는 롤로 `InvokeGateway`와 `InvokeWebSearch` 권한이 필요하며 게이트웨이보다 먼저 만들어야 합니다. 호출자 롤은 에이전트가 게이트웨이를 호출할 때 쓰는 롤로 `InvokeGateway` 권한만 있으면 됩니다."
- q: "MCP 클라이언트에 AgentCore Gateway를 어떻게 등록하나요?"
  a: "stdio 방식으로 `uvx mcp-proxy-for-aws@latest <게이트웨이 MCP 엔드포인트>`를 실행 명령으로 지정하고 `AWS_REGION` 환경 변수만 전달합니다. EC2 인스턴스 프로파일 롤로 인증이 자동 처리되어 별도 키 설정이 필요 없습니다."
- q: "프록시로 tools/list를 보냈는데 초기화 응답만 오는 이유는 무엇인가요?"
  a: "표준 입력이 즉시 닫혀 프록시가 게이트웨이까지 왕복할 시간이 부족하기 때문입니다. 본문 예시처럼 메시지 뒤에 `sleep 6`을 두어 입력을 잠시 열어둔 상태로 요청을 보내야 합니다."
