# AEO data for _posts/2026-02-09-opencode-with-bedrock.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
description: "터미널 AI 코딩 어시스턴트 opencode를 설치하고, EC2 인스턴스 프로파일의 IAM role 인증으로 API KEY 없이 Amazon Bedrock과 연동하는 방법을 정리합니다."
keywords:
- "opencode"
- "Amazon Bedrock"
- "IAM role 인증"
- "auth.json"
- "opencode.json"
- "EC2 인스턴스 프로파일"
- "Ec2InstanceMetadata"
summary:
- "opencode는 터미널용 AI 코딩 어시스턴트로, `auth.json`과 `opencode.json`을 설정하면 API KEY 없이 IAM role 인증으로 Amazon Bedrock을 사용할 수 있습니다."
- "EC2 인스턴스 프로파일을 쓰는 경우 `~/.aws/config`에 `credential_source = Ec2InstanceMetadata`를 지정하고 opencode provider에 region과 profile을 설정합니다."
tested_on: "Amazon Linux 2023 (ap-northeast-2), opencode 1.1.53"
faq:
- q: "opencode는 어떻게 설치하나요?"
  a: "`curl -fsSL https://opencode.ai/install | bash`로 설치합니다. 설치 스크립트가 `/root/.bashrc`에 PATH를 추가하며, 프로젝트 디렉터리에서 `opencode`를 실행하면 됩니다."
- q: "opencode에서 Amazon Bedrock을 IAM role로 인증하려면 무엇을 설정하나요?"
  a: "`~/.local/share/opencode/auth.json`에 `amazon-bedrock`의 `type`을 `iam`으로 지정하고, `~/.config/opencode/opencode.json`의 `amazon-bedrock` provider options에 `region`과 `profile`을 설정합니다."
- q: "opencode에서 Bedrock IAM role 인증이 실패하면 무엇을 확인해야 하나요?"
  a: "`auth.json`에 `type`이 `iam`으로 올바르게 설정되어 있는지 먼저 확인합니다."
