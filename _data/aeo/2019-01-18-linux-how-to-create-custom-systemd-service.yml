# AEO data for _posts/2019-01-18-linux-how-to-create-custom-systemd-service.md
# 빌드 시 _plugins/aeo_data.rb 가 포스트 front matter 에 병합 (front matter 값이 있으면 그쪽 우선)
keywords:
- "systemd"
- "systemctl"
- "unit 파일"
- "Restart=on-failure"
- "WantedBy=multi-user.target"
- "/etc/systemd/system"
summary:
- "/etc/systemd/system/ 아래에 .service 유닛 파일을 만들면 직접 작성한 스크립트를 systemd 서비스로 등록하고 관리할 수 있습니다."
- "`systemctl start`로 서비스를 시작하고 `systemctl enable`로 등록하면 재부팅 후에도 자동으로 시작됩니다."
- "`Restart=on-failure`를 설정하면 프로세스를 `kill -9`로 강제 종료해도 systemd가 서비스를 자동으로 재시작합니다."
faq:
- q: "사용자 스크립트를 systemd 서비스로 등록하려면 어떻게 하나요?"
  a: "`/etc/systemd/system/testchk.service` 같은 유닛 파일을 만들고 [Unit], [Service], [Install] 섹션을 작성합니다. [Service]의 `ExecStart`에 실행할 스크립트 경로를 지정한 뒤 `systemctl start testchk`로 시작합니다."
- q: "재부팅 후에도 서비스가 자동으로 시작되게 하려면 어떻게 하나요?"
  a: "`systemctl enable testchk`를 실행합니다. [Install] 섹션의 `WantedBy=multi-user.target` 설정에 따라 multi-user.target.wants 아래에 심볼릭 링크가 생성됩니다."
- q: "서비스 프로세스가 죽었을 때 자동으로 재시작되게 하려면 어떻게 하나요?"
  a: "[Service] 섹션에 `Restart=on-failure`를 지정합니다. 글의 테스트에서 메인 프로세스를 `kill -9`로 종료하자 systemd가 서비스를 다시 시작했습니다."
