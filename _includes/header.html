<header id="header">
    <button id="menu-toggle" type="button">
        <span class="sr-only">Toggle Navigation Menu</span>
    </button>
    <button id="search-toggle" type="button">
        <span class="sr-only">Toggle Search Form</span>
    </button>
    <a href="/" id="logo" aria-label="{{ site.title }} 홈"></a>
    <!--form id="search"-->
    <div id="search">
        <!--input id="searchQueryEdit" name="q" type="search" placeholder="Search..." value="" /-->
        <div id="dark-mode-toggle" class="dark-mode-switch">
            <input type="checkbox" id="dark-mode-checkbox" aria-label="다크 모드" />
            <label for="dark-mode-checkbox" class="toggle-label">
                <span class="toggle-slider"></span>
            </label>
        </div>
        <input id="search-input" type="search" placeholder="Search..." value="" aria-label="블로그 검색" data-search-json="{{ site.baseurl }}/assets/lib/search.json" />
    </div>
    <ul class="search__results" id="results-container"></ul>
    <!--/form-->

    <nav aria-label="주 메뉴">
    <ul id="menu" class="nav">
        <li class="{% if page.url == '/' or page.url contains '/page/' %} active {% endif %}"><a href="{{ base_path }}/">Blog</a></li>
        <li class="{% if page.url == '/about/' %} active {% endif %}"><a href="{{ base_path }}/about/">About</a></li>
        <li class="{% if page.url == '/Links/' %} active {% endif %}"><a href="{{ base_path }}/Links/">Links</a></li>
    </ul>
    </nav>

</header><!-- #header -->
