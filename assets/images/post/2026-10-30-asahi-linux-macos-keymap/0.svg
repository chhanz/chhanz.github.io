<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" role="img" aria-label="Asahi Linux macOS Keymap - Toshy + Caps Lock 한/영 전환">
  <title>Asahi Linux macOS Keymap - Toshy + Caps Lock 한/영 전환</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="0.6" stop-color="#172036"/><stop offset="1" stop-color="#1e2a44"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/><stop offset="0.5" stop-color="#ec4899"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="capHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1280" height="240" fill="url(#bg)"/>
  <rect width="1280" height="240" fill="url(#dots)"/>
  <rect width="1280" height="4" fill="url(#accent)"/>

  <!-- 왼쪽: 키캡 -->
  <g font-family="'SF Pro Display', 'Pretendard', 'Noto Sans KR', 'Noto Sans CJK KR', system-ui, sans-serif">
    <!-- ⌘ + C -->
    <g transform="translate(96 46)">
      <rect y="6" width="72" height="72" rx="12" fill="#0b1220" opacity="0.6"/>
      <rect width="72" height="72" rx="12" fill="url(#cap)"/>
      <text x="36" y="49" text-anchor="middle" font-size="36" font-weight="600" fill="#1e293b">⌘</text>
    </g>
    <text x="196" y="94" text-anchor="middle" font-size="28" font-weight="600" fill="#94a3b8">+</text>
    <g transform="translate(224 46)">
      <rect y="6" width="72" height="72" rx="12" fill="#0b1220" opacity="0.6"/>
      <rect width="72" height="72" rx="12" fill="url(#cap)"/>
      <text x="36" y="48" text-anchor="middle" font-size="32" font-weight="700" fill="#1e293b">C</text>
    </g>

    <!-- Caps Lock -> 한/A -->
    <g transform="translate(96 136)">
      <rect y="6" width="132" height="60" rx="12" fill="#0b1220" opacity="0.6"/>
      <rect width="132" height="60" rx="12" fill="url(#cap)"/>
      <circle cx="18" cy="16" r="4" fill="#22c55e"/>
      <text x="66" y="40" text-anchor="middle" font-size="19" font-weight="600" fill="#1e293b">caps lock</text>
    </g>
    <path d="M244 166 H268" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M264 158 L276 166 L264 174" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(288 136)">
      <rect y="6" width="84" height="60" rx="12" fill="#0b1220" opacity="0.6"/>
      <rect width="84" height="60" rx="12" fill="url(#capHi)"/>
      <text x="42" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">한/A</text>
    </g>
  </g>

  <!-- 구분선 -->
  <rect x="432" y="56" width="2" height="128" rx="1" fill="#334155"/>

  <!-- 오른쪽: 제목 -->
  <g font-family="'SF Pro Display', 'Pretendard', 'Noto Sans KR', 'Noto Sans CJK KR', system-ui, sans-serif">
    <text x="476" y="98" font-size="50" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Asahi Linux <tspan fill="#fdba74">macOS</tspan> Keymap</text>
    <text x="478" y="144" font-size="26" font-weight="600" fill="#cbd5e1">Toshy + Caps Lock 한/영 전환</text>
    <text x="478" y="184" font-size="18" font-weight="500" fill="#64748b">Fedora Asahi Remix 44 · GNOME 50 Wayland · ibus-hangul</text>
  </g>
</svg>
